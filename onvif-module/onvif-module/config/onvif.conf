[server]
device_ip       = 192.168.8.102
http_port       = 8001
rtsp_port       = 8554
device_uuid     = 12345678-1234-1234-1234-123456789abc

[auth]
username        = admin
password        = admin123

[backend]
# mock: giữ baseline; hybrid: route từng capability; production: không fallback mock.
mode            = hybrid
ctrl_socket     = /tmp/mock-camera.sock
evt_socket      = /tmp/mock-camera-evt.sock
connect_timeout = 5
mock_required   = false
mgmt_base_url   = http://127.0.0.1:8086
dvr_base_url    = http://127.0.0.1:8200
connect_timeout_ms = 1000
request_timeout_ms = 3000
retry_interval_ms  = 2000

[capabilities]
device           = real
network          = real
identity         = mock
media            = real
imaging          = mock
ptz              = mock
analytics        = mock
events           = mock
recording        = mock
search           = mock
replay           = mock

[startup]
# Tắt ở vertical slice để các capability mock chưa có socket không chặn SOAP server.
run_smoke_tests  = false

[discovery]
# Tắt khi chạy song song với ONVIF cũ để không cùng sử dụng UDP multicast 3702.
enable          = false
interface       = enp3s0

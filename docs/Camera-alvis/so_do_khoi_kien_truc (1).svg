<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="Arial, sans-serif">
  <defs>
    <marker id="aBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1F6FB2"/></marker>
    <marker id="aOrange" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#C77A1B"/></marker>
    <marker id="aGreen" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E7D46"/></marker>
    <marker id="aGray" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8A8A8A"/></marker>
    <marker id="aGrayS" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#8A8A8A"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="22" font-weight="bold" fill="#1F3A5F">Sơ đồ khối kiến trúc &amp; luồng dữ liệu — Firmware Camera AI</text>
  <text x="40" y="62" font-size="13" fill="#666">5 service chức năng (DVR · VPU · Core · Gateway · MGMT) trên 2 service nền tảng (HAL · BUS &amp; IPC)</text>

  <!-- band tags -->
  <text x="34" y="245" font-size="12" fill="#9aa" transform="rotate(-90,34,245)" text-anchor="middle">SERVICE CHỨC NĂNG</text>
  <text x="34" y="450" font-size="12" fill="#9aa" transform="rotate(-90,34,450)" text-anchor="middle">SERVICE NỀN TẢNG</text>
  <text x="34" y="655" font-size="12" fill="#9aa" transform="rotate(-90,34,655)" text-anchor="middle">PHẦN CỨNG</text>

  <!-- MGMT -->
  <rect x="120" y="92" width="880" height="58" rx="8" fill="#EFEDFB" stroke="#5A4F91" stroke-width="1.5"/>
  <text x="560" y="116" font-size="15" font-weight="bold" fill="#3F367A" text-anchor="middle">MGMT</text>
  <text x="560" y="136" font-size="11.5" fill="#444" text-anchor="middle">ConfigAPI (Web + API) · ONVIF · OTA · LogDiag   — control plane / quản lý</text>

  <!-- External -->
  <rect x="1045" y="92" width="170" height="58" rx="8" fill="#E9F3EC" stroke="#2E7D46" stroke-width="1.5"/>
  <text x="1130" y="116" font-size="13" font-weight="bold" fill="#235C36" text-anchor="middle">VMS / ONVIF</text>
  <text x="1130" y="135" font-size="11" fill="#444" text-anchor="middle">client (Profile S/G/T/M)</text>
  <rect x="1045" y="300" width="170" height="70" rx="8" fill="#E9F3EC" stroke="#2E7D46" stroke-width="1.5"/>
  <text x="1130" y="330" font-size="13" font-weight="bold" fill="#235C36" text-anchor="middle">Cloud · RTMP</text>
  <text x="1130" y="348" font-size="13" font-weight="bold" fill="#235C36" text-anchor="middle">MQTT · FTP</text>
  <text x="1130" y="364" font-size="10.5" fill="#444" text-anchor="middle">(đầu ra ngoài)</text>

  <!-- Functional services -->
  <g>
    <rect x="120" y="205" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="205" y="234" font-size="15" font-weight="bold" fill="#1F3A5F" text-anchor="middle">DVR</text>
    <text x="205" y="254" font-size="10.5" fill="#444" text-anchor="middle">Capture · Encode</text>
    <text x="205" y="268" font-size="10.5" fill="#444" text-anchor="middle">Record · Stream</text>

    <rect x="340" y="205" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="425" y="234" font-size="15" font-weight="bold" fill="#1F3A5F" text-anchor="middle">VPU</text>
    <text x="425" y="254" font-size="10.5" fill="#444" text-anchor="middle">Plugin AI · Inference</text>
    <text x="425" y="268" font-size="10.5" fill="#444" text-anchor="middle">Tracker</text>

    <rect x="560" y="205" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="645" y="234" font-size="15" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Core</text>
    <text x="645" y="254" font-size="10.5" fill="#444" text-anchor="middle">Rule · Alarm</text>
    <text x="645" y="268" font-size="10.5" fill="#444" text-anchor="middle">Metadata · Analytics</text>

    <rect x="830" y="205" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="915" y="234" font-size="15" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Gateway</text>
    <text x="915" y="254" font-size="10.5" fill="#444" text-anchor="middle">Security core</text>
    <text x="915" y="268" font-size="10.5" fill="#444" text-anchor="middle">Output adapters</text>
  </g>

  <!-- BUS -->
  <rect x="120" y="340" width="880" height="72" rx="8" fill="#EAF0F6" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="150" y="368" font-size="15" font-weight="bold" fill="#1F3A5F">BUS &amp; IPC</text>
  <line x1="430" y1="346" x2="430" y2="406" stroke="#9DB4C9" stroke-dasharray="3 3"/>
  <line x1="700" y1="346" x2="700" y2="406" stroke="#9DB4C9" stroke-dasharray="3 3"/>
  <text x="300" y="384" font-size="12" fill="#1F6FB2" font-weight="bold" text-anchor="middle">Frame bus</text>
  <text x="565" y="384" font-size="12" fill="#C77A1B" font-weight="bold" text-anchor="middle">Event bus</text>
  <text x="850" y="384" font-size="12" fill="#8A8A8A" font-weight="bold" text-anchor="middle">Control IPC</text>

  <!-- HAL -->
  <rect x="120" y="470" width="880" height="88" rx="8" fill="#EAF0F6" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="560" y="498" font-size="15" font-weight="bold" fill="#1F3A5F" text-anchor="middle">HAL — Hardware Abstraction Layer</text>
  <text x="560" y="522" font-size="11.5" fill="#444" text-anchor="middle">SensorHAL · CodecHAL* · InternalPeripheralHAL · ExternalPeripheralHAL · InferenceBackend*</text>
  <text x="560" y="544" font-size="10.5" fill="#777" font-style="italic" text-anchor="middle">* CodecHAL &amp; InferenceBackend liên kết in-process trong DVR / VPU (không qua IPC)</text>

  <!-- Hardware -->
  <g>
    <rect x="120" y="620" width="170" height="60" rx="6" fill="#EFEFEA" stroke="#888"/>
    <text x="205" y="646" font-size="12.5" font-weight="bold" fill="#555" text-anchor="middle">Image Sensor</text>
    <text x="205" y="664" font-size="10.5" fill="#666" text-anchor="middle">/ ISP</text>
    <rect x="340" y="620" width="170" height="60" rx="6" fill="#EFEFEA" stroke="#888"/>
    <text x="425" y="654" font-size="12.5" font-weight="bold" fill="#555" text-anchor="middle">Codec HW</text>
    <rect x="560" y="620" width="170" height="60" rx="6" fill="#EFEFEA" stroke="#888"/>
    <text x="645" y="654" font-size="12.5" font-weight="bold" fill="#555" text-anchor="middle">NPU</text>
    <rect x="830" y="620" width="170" height="60" rx="6" fill="#EFEFEA" stroke="#888"/>
    <text x="915" y="646" font-size="12.5" font-weight="bold" fill="#555" text-anchor="middle">Ngoại vi</text>
    <text x="915" y="664" font-size="10.5" fill="#666" text-anchor="middle">nội / ngoại</text>
  </g>

  <!-- ===== DATA-PLANE ARROWS (blue: raw frames) ===== -->
  <line x1="205" y1="618" x2="205" y2="560" stroke="#1F6FB2" stroke-width="3" marker-end="url(#aBlue)"/>
  <line x1="240" y1="468" x2="240" y2="414" stroke="#1F6FB2" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="252" y="447" font-size="10" fill="#1F6FB2">khung</text>
  <line x1="205" y1="338" x2="205" y2="279" stroke="#1F6FB2" stroke-width="3" marker-end="url(#aBlue)"/>
  <line x1="400" y1="338" x2="400" y2="279" stroke="#1F6FB2" stroke-width="3" marker-end="url(#aBlue)"/>

  <!-- ===== INFO-PLANE ARROWS (orange: Detection/Event) ===== -->
  <line x1="455" y1="279" x2="455" y2="338" stroke="#C77A1B" stroke-width="2.6" marker-end="url(#aOrange)"/>
  <text x="463" y="312" font-size="10" fill="#C77A1B">Det/Event</text>
  <line x1="615" y1="338" x2="615" y2="279" stroke="#C77A1B" stroke-width="2.6" marker-end="url(#aOrange)"/>
  <line x1="680" y1="279" x2="680" y2="338" stroke="#C77A1B" stroke-width="2.6" marker-end="url(#aOrange)"/>
  <line x1="915" y1="338" x2="915" y2="279" stroke="#C77A1B" stroke-width="2.6" marker-end="url(#aOrange)"/>

  <!-- ===== MEDIA OUT (green) ===== -->
  <!-- DVR media -> Gateway (routed under services) -->
  <path d="M250,279 L250,308 L968,308 L968,279" fill="none" stroke="#2E7D46" stroke-width="2.6" marker-end="url(#aGreen)"/>
  <text x="600" y="303" font-size="10" fill="#2E7D46" text-anchor="middle">media (RTSP) → Gateway</text>
  <!-- Gateway -> Cloud -->
  <path d="M1000,250 L1045,322" fill="none" stroke="#2E7D46" stroke-width="3" marker-end="url(#aGreen)"/>
  <text x="1012" y="290" font-size="10" fill="#2E7D46">ra ngoài</text>

  <!-- ===== CONTROL PLANE (gray dashed) ===== -->
  <line x1="205" y1="152" x2="205" y2="203" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <line x1="425" y1="152" x2="425" y2="203" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <line x1="645" y1="152" x2="645" y2="203" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <line x1="915" y1="152" x2="915" y2="203" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="470" y="190" font-size="10" fill="#8A8A8A">control plane (cấu hình · OTA · lệnh)</text>
  <!-- MGMT -> BUS control -> HAL -> peripheral -->
  <line x1="780" y1="152" x2="780" y2="338" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <line x1="780" y1="412" x2="780" y2="468" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <line x1="915" y1="560" x2="915" y2="618" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="922" y="592" font-size="10" fill="#8A8A8A">lệnh ngoại vi</text>
  <!-- ONVIF <-> VMS -->
  <line x1="1000" y1="115" x2="1045" y2="118" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)" marker-start="url(#aGrayS)"/>
  <text x="1004" y="108" font-size="10" fill="#8A8A8A">ONVIF</text>

  <!-- HAL <-> codec/npu thin -->
  <line x1="425" y1="560" x2="425" y2="618" stroke="#9aa" stroke-width="1.2"/>
  <line x1="645" y1="560" x2="645" y2="618" stroke="#9aa" stroke-width="1.2"/>

  <!-- ===== LEGEND ===== -->
  <rect x="120" y="720" width="540" height="132" rx="8" fill="#FBFBF9" stroke="#D8D5CC"/>
  <text x="138" y="744" font-size="13" font-weight="bold" fill="#1F3A5F">Chú thích luồng</text>
  <line x1="140" y1="766" x2="180" y2="766" stroke="#1F6FB2" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="192" y="770" font-size="12" fill="#333">Khung thô — data plane, zero-copy (Sensor→bus→DVR/VPU)</text>
  <line x1="140" y1="790" x2="180" y2="790" stroke="#C77A1B" stroke-width="2.6" marker-end="url(#aOrange)"/>
  <text x="192" y="794" font-size="12" fill="#333">Detection / Event / metadata (VPU→Core→Gateway)</text>
  <line x1="140" y1="814" x2="180" y2="814" stroke="#2E7D46" stroke-width="3" marker-end="url(#aGreen)"/>
  <text x="192" y="818" font-size="12" fill="#333">Đầu ra ra ngoài — media &amp; cảnh báo (đã mã hóa)</text>
  <line x1="140" y1="838" x2="180" y2="838" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="192" y="842" font-size="12" fill="#333">Control plane — cấu hình · OTA · lệnh ngoại vi · ONVIF</text>

  <!-- note -->
  <rect x="680" y="720" width="320" height="132" rx="8" fill="#FBFBF9" stroke="#D8D5CC"/>
  <text x="698" y="744" font-size="13" font-weight="bold" fill="#1F3A5F">Ghi chú</text>
  <text x="698" y="766" font-size="11" fill="#444">• Mọi luồng ra ngoài đi qua một cổng Gateway</text>
  <text x="698" y="784" font-size="11" fill="#444">  (TLS, xác thực, audit).</text>
  <text x="698" y="804" font-size="11" fill="#444">• ONVIF (trong MGMT) lấy media từ DVR, metadata</text>
  <text x="698" y="822" font-size="11" fill="#444">  từ VPU, sự kiện từ Core qua IPC.</text>
  <text x="698" y="842" font-size="11" fill="#444">• HAL daemon publish khung lên frame bus.</text>
</svg>
